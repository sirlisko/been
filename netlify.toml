[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  PNPM_VERSION = "10"

[dev]
  command = "pnpm dev"
  port = 8888
  targetPort = 5175

# Umami, first-party so the CSP stays same-origin and blockers leave it alone
[[redirects]]
  from = "/stats/script.js"
  to = "https://stats.sirlisko.com/script.js"
  status = 200

[[redirects]]
  from = "/stats/api/send"
  to = "https://stats.sirlisko.com/api/send"
  status = 200

[[redirects]]
  from = "/print"
  to = "/index.html"
  status = 200

# Shared maps at /@username are rendered by the SPA
[[redirects]]
  from = "/@*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
