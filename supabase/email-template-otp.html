<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Been sign-in code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #F3EDE2; font-family: Georgia, 'Times New Roman', serif; color: #1F2A44;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color: #F3EDE2; padding: 40px 16px;">
      <tr>
        <td align="center">
          <table width="520" cellpadding="0" cellspacing="0" role="presentation" style="max-width: 520px; width: 100%; background-color: #F8F4EC; border: 1px solid #1F2A44; outline: 1px solid #1F2A44; outline-offset: 4px;">

            <tr>
              <td style="padding: 28px 36px 18px; border-bottom: 1px solid #1F2A44;">
                <span style="font-size: 30px; font-style: italic; font-weight: bold;">Been.</span>
                <span style="font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6B6457; padding-left: 10px;">Travel record</span>
              </td>
            </tr>

            <tr>
              <td style="padding: 32px 36px 8px;">
                <p style="margin: 0; font-size: 26px; line-height: 1.2;">Your sign-in code</p>
                <p style="margin: 10px 0 0; font-family: Arial, sans-serif; font-size: 15px; line-height: 1.5; color: #6B6457;">
                  Enter this code in Been to sync your stamps across devices.
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding: 24px 36px 8px;">
                <div style="display: inline-block; border: 3px solid #B8432F; padding: 6px;">
                  <div style="border: 1px solid #B8432F; padding: 16px 32px;">
                    <span style="font-family: 'Courier New', monospace; font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #B8432F;">{{ .Token }}</span>
                  </div>
                </div>
                <p style="margin: 14px 0 0; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6B6457;">
                  Expires in 10 minutes
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding: 24px 36px 32px;">
                <p style="margin: 0 0 12px; font-family: Arial, sans-serif; font-size: 13px; color: #6B6457;">or</p>
                <a href="{{ .ConfirmationURL }}"
                   style="display: inline-block; background-color: #1F2A44; color: #F3EDE2; text-decoration: none; padding: 14px 28px; font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;">
                  Sign in with one click
                </a>
              </td>
            </tr>

            <tr>
              <td style="padding: 18px 36px 24px; border-top: 1px solid #1F2A44;">
                <p style="margin: 0; font-family: Arial, sans-serif; font-size: 12px; line-height: 1.6; color: #6B6457;">
                  Didn&rsquo;t ask for this? You can safely ignore this email.<br />
                  Where have you been? &mdash; <a href="https://been.sirlisko.com" style="color: #1F2A44;">been.sirlisko.com</a>
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
